[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portalsentinel"
version = "0.1.0"
description = "CLI-first onchain identity and workflow orchestrator for Portaldot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.1",
  "httpx>=0.27.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.3.4",
  "substrate-interface>=1.7.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
portalctl = "portalsentinel.cli:app"
portalsentinel-api = "portalsentinel.api_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
